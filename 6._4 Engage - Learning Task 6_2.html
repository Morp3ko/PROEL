<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learning Task 6.2 – Animated SVG Weather Icon</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #eef3f8; font-family: Arial, sans-serif; color: #345; }
  svg { border-radius: 24px; box-shadow: 0 6px 18px rgba(0,0,0,.2); }
  p { margin-top: 14px; }
</style>
</head>
<body>
<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7cc4ff"/>
      <stop offset="100%" stop-color="#d9f0ff"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff59d"/>
      <stop offset="100%" stop-color="#ffb300"/>
    </radialGradient>
  </defs>

  <rect width="300" height="300" fill="url(#sky)"/>

  <!-- Rotating sun rays -->
  <g stroke="#ffc400" stroke-width="6" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" from="0 150 110" to="360 150 110" dur="12s" repeatCount="indefinite"/>
    <line x1="150" y1="40" x2="150" y2="58"/>
    <line x1="150" y1="162" x2="150" y2="180"/>
    <line x1="80" y1="110" x2="98" y2="110"/>
    <line x1="202" y1="110" x2="220" y2="110"/>
    <line x1="100" y1="60" x2="112" y2="72"/>
    <line x1="188" y1="148" x2="200" y2="160"/>
    <line x1="200" y1="60" x2="188" y2="72"/>
    <line x1="112" y1="148" x2="100" y2="160"/>
  </g>

  <!-- Pulsing sun -->
  <circle cx="150" cy="110" r="36" fill="url(#sun)">
    <animate attributeName="r" values="36;41;36" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Drifting cloud with falling rain -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="-18,0; 18,0; -18,0" dur="6s" repeatCount="indefinite"/>
    <g fill="#ffffff" stroke="#c5d3e0" stroke-width="2">
      <rect x="95" y="165" width="115" height="38" rx="19"/>
      <circle cx="130" cy="165" r="26"/>
      <circle cx="168" cy="155" r="34"/>
    </g>
    <rect x="97" y="168" width="111" height="33" rx="16" fill="#fff"/>
    <g stroke="#2f8fe8" stroke-width="5" stroke-linecap="round">
      <line x1="125" y1="215" x2="125" y2="228">
        <animateTransform attributeName="transform" type="translate" values="0,0; 0,50" dur="1s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0" dur="1s" repeatCount="indefinite"/>
      </line>
      <line x1="153" y1="215" x2="153" y2="228">
        <animateTransform attributeName="transform" type="translate" values="0,0; 0,50" dur="1s" begin="0.33s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0" dur="1s" begin="0.33s" repeatCount="indefinite"/>
      </line>
      <line x1="181" y1="215" x2="181" y2="228">
        <animateTransform attributeName="transform" type="translate" values="0,0; 0,50" dur="1s" begin="0.66s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0" dur="1s" begin="0.66s" repeatCount="indefinite"/>
      </line>
    </g>
  </g>
</svg>
<p>Animated SVG: spinning sun, drifting cloud, falling rain</p>
</body>
</html>
